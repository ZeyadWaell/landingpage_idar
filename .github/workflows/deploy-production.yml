name: Deploy to Production

on:
  push:
    branches: [production]

env:
  APP_NAME: idar-landing
  DEPLOY_PATH: /var/www/idar-landing
  NODE_VERSION: "20.x"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Node.js version
        run: |
          node -v
          node -e "const v=process.versions.node.split('.').map(Number); if(v[0]<20) { console.error('Node 20+ required for Next.js 16. Upgrade system Node — PM2 uses the same node as the shell.'); process.exit(1) }"

      - name: Ensure target directory
        run: sudo mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Sync files to server path (keep server .env)
        run: |
          rsync -a --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude ".cursor" \
            ./ ${{ env.DEPLOY_PATH }}/
          sudo chown -R $(whoami):$(whoami) ${{ env.DEPLOY_PATH }}

      - name: Install and build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd ${{ env.DEPLOY_PATH }}
          # Install devDependencies too — Tailwind/PostCSS/TypeScript are required for next build
          npm ci --include=dev
          NODE_ENV=production npm run build

      - name: Start or reload with PM2
        env:
          NODE_ENV: production
          PM2_HOME: ${{ env.HOME }}/.pm2
        run: |
          command -v pm2 >/dev/null 2>&1 || sudo npm i -g pm2

          cd ${{ env.DEPLOY_PATH }}
          # Delete + start so PM2 picks up ecosystem script/mode changes (reload keeps stale config)
          pm2 delete ${{ env.APP_NAME }} 2>/dev/null || true
          pm2 start cicd/ecosystem.config.cjs
          pm2 save
          pm2 status
