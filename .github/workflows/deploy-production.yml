name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  APP_NAME: idar-landing
  NODE_VERSION: "20.x"

jobs:
  deploy:
    # Only the runner installed on idar-01 has this label, so the old server never picks this up.
    runs-on: [self-hosted, idar-01]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify Node.js version
        run: |
          node -v
          node -e "const v=process.versions.node.split('.').map(Number); if(v[0]<20) { console.error('Node 20+ required for Next.js 16. Upgrade system Node — PM2 uses the same node as the shell.'); process.exit(1) }"

      - name: Find the running app
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          # Deploy to wherever PM2 runs the app, and stop before touching files if it isn't there
          APP=$(pm2 jlist | node -e 'const p=JSON.parse(require("fs").readFileSync(0)).find((a)=>a.name===process.argv[1]);console.log(p?p.pm2_env.pm_cwd:"")' "$APP_NAME")
          if [ -z "$APP" ]; then
            echo "::error::No PM2 process named $APP_NAME on $(hostname)"
            pm2 list
            exit 1
          fi
          if ! grep -q '"name": "next_js_landing_page"' "$APP/package.json"; then
            echo "::error::$APP does not look like the landing page, refusing to sync into it"
            exit 1
          fi
          echo "Deploying to $APP on $(hostname)"
          echo "DEPLOY_PATH=$APP" >> "$GITHUB_ENV"

      - name: Sync files to server path (keep server .env)
        run: |
          rsync -a --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude ".cursor" \
            ./ "$DEPLOY_PATH"/

      - name: Install and build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd "$DEPLOY_PATH"
          # Install devDependencies too — Tailwind/PostCSS/TypeScript are required for next build
          npm ci --include=dev
          NODE_ENV=production npm run build

      - name: Restart with PM2
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          # Restart keeps the process's own port and working directory
          pm2 restart "$APP_NAME"
          pm2 save
          pm2 status
